[build]
  command = "npm install && npm run build"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.162.1"
  NODE_VERSION = "22"
  TZ = "America/Chicago"

# HUGO_ENVIRONMENT is intentionally left unset here: a plain `hugo` build
# (used by [build] above, via `npm run build`) already defaults to the
# "production" environment on its own. Deploy previews and branch deploys
# pass --environment preview below so robots.txt/meta robots correctly
# block indexing on *.netlify.app URLs instead of inheriting production.

[context.deploy-preview]
  command = "npm install && npm run sync:cv && hugo --gc --minify --buildFuture --environment preview -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "npm install && npm run sync:cv && hugo --gc --minify --environment preview -b $DEPLOY_PRIME_URL"
