baseURL: 'https://gavinsdavies.com/'

title: Gavin S. Davies
copyright: '© 2026 Gavin S. Davies'

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

# Content
enableEmoji: true
enableGitInfo: false
summaryLength: 30

# Security
enableInlineShortcodes: false

# Pagination
pagination:
  pagerSize: 10

# Taxonomies
taxonomies:
  tag: tags
  category: categories

outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
    - RSS

# Image processing
imaging:
  resampleFilter: lanczos
  quality: 80
  anchor: smart

# Markup
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: Gavin S. Davies
    params:
      profileMode:
        subtitle: Experimental particle physicist at the University of Mississippi working on neutrino oscillations with NOvA, DUNE, and EMPHATIC.
  es:
    label: Espanol
    locale: es
    weight: 2
    title: Gavin S. Davies
    params:
      profileMode:
        subtitle: Fisico experimental de particulas en la Universidad de Mississippi. Traduccion completa pendiente.
  da:
    label: Dansk
    locale: da
    weight: 3
    title: Gavin S. Davies
    params:
      profileMode:
        subtitle: Eksperimentel partikelfysiker ved University of Mississippi. Fuld oversaettelse kommer senere.
  fr:
    label: Francais
    locale: fr
    weight: 4
    title: Gavin S. Davies
    params:
      profileMode:
        subtitle: Physicien experimental des particules a l'Universite du Mississippi. Traduction complete a venir.
  de:
    label: Deutsch
    locale: de
    weight: 5
    title: Gavin S. Davies
    params:
      profileMode:
        subtitle: Experimenteller Teilchenphysiker an der University of Mississippi. Vollstaendige Uebersetzung folgt.
