baseURL: 'https://gavinsdavies.com/'

title: Gavin S. Davies
copyright: '© 2026 Gavin S. Davies'

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

# Content
enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
summaryLength: 30

# Security
enableInlineShortcodes: false

# Pagination
pagination:
  pagerSize: 10

# Taxonomies
taxonomies:
  tag: tags
  category: categories

outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
    - RSS

# Image processing
imaging:
  resampleFilter: lanczos
  quality: 80
  anchor: smart

# Markup
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

